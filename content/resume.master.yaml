  - id: projects
    title: { zh: "精选产品实践", en: "SELECTED PRODUCT WORK" }
    entries:
      - id: cuelayer
        title: { zh: "CueLayer", en: "CueLayer" }
        subtitle: { zh: "Speech-first Teaching Presentation Layer｜Product Lead / Builder", en: "Speech-first Teaching Presentation Layer · Product Lead / Builder" }
        meta: { zh: "2026.08–至今｜Working Prototype", en: "Aug 2026–Present · Working Prototype" }
        bullets:
          - id: cuelayer-thesis
            facts:
              - "保留教师完整原始表达"
              - "Plain Caption 为 canonical surface"
              - "FX 可关闭，AI 失效时完整字幕仍可用"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [product thesis, ai UX, graceful degradation, teacher workflow, realtime]
                text:
                  zh: "面向实时授课、录课与在线教学设计 speech-first presentation layer：保留教师完整表达，以 Plain Caption 作为 canonical surface，并用可关闭 FX 呈现重点、关系与概念变化，使 AI 增强失效时教学信息仍完整可用。"
                  en: "Designed a speech-first presentation layer for live and recorded teaching that preserves the teacher's complete expression as the canonical caption surface, with optional visual FX for emphasis, relationships and conceptual change so the experience degrades gracefully when AI is unavailable."
              - profile: education_product
                tags: [teacher experience, learning experience, cognitive load, note taking]
                text:
                  zh: "围绕教师自然讲解设计视觉辅助层，在不替学生总结课程、不剥夺自主笔记的前提下，把口头表达中的重点、关系和变化转化为克制的实时视觉线索。"
                  en: "Designed restrained live visual cues around natural teaching without replacing students' own synthesis or note-taking."
          - id: cuelayer-grammar
            facts:
              - "核心 visual grammar 为 FOCUS / RELATE / TRANSFORM"
              - "由结构化 plan 控制 motion，而非模型直接生成动画"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [structured output, ai control, interaction model, deterministic runtime]
                text:
                  zh: "将开放式视觉表达收敛为 FOCUS / RELATE / TRANSFORM 三类最小 motion primitives，并用结构化 plan 控制 treatment、intensity、duration 与状态 progression；AI 负责不确定语义判断，deterministic runtime 负责可预测执行。"
                  en: "Reduced open-ended visual generation to three motion primitives—FOCUS, RELATE and TRANSFORM—using structured plans for treatment, intensity, duration and progression; AI handles uncertain interpretation while a deterministic runtime executes predictably."
              - profile: technical
                tags: [renderer, state machine, structured plan, deterministic execution]
                text:
                  zh: "建立 phrase-level target、pending / active / completed progression 与统一 Motion Grammar，使 semantic planner 与 renderer 解耦，并可通过 fixtures 和 replay 独立验证视觉执行。"
                  en: "Defined phrase-level targets, pending/active/completed progression and a unified motion grammar to decouple semantic planning from renderer execution and enable fixture-based replay."
          - id: cuelayer-architecture
            facts:
              - "Speech-first Caption Engine 与 Slide-linked Overlay Engine 分层"
              - "已完成 FX engine core、8 组 visual fixtures、replay/plan inspection、CI"
            default_profile: technical
            variants:
              - profile: ai_product
                tags: [scope, architecture, latency, mvp, tradeoff]
                text:
                  zh: "主动将低延迟 Speech-first Caption Engine 与后续 Slide-linked Overlay Engine 分层，控制实时链路 latency、复杂度与 failure surface；当前已完成 FX engine core、8 组 visual fixtures、replay / plan inspection 与 CI 验证。"
                  en: "Separated the low-latency Speech-first Caption Engine from a later Slide-linked Overlay Engine to control latency, complexity and failure surface; completed the FX engine core, eight visual fixtures, replay/plan inspection and CI validation."
              - profile: technical
                tags: [architecture, realtime, latency, testing, ci]
                text:
                  zh: "通过清晰的引擎边界、fixtures、replay 与 CI 建立可观察的实时渲染链路，并为后续 ASR、semantic planner 与课程知识接入保留扩展接口。"
                  en: "Built an observable realtime rendering pipeline with explicit engine boundaries, fixtures, replay and CI, leaving clean extension points for ASR, semantic planning and domain knowledge."
