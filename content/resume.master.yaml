        bullets:
          - id: hailiang-rollout
            facts:
              - "覆盖英语、数学、化学等多学科"
              - "所在教务体系覆盖 200+ 学生、40+ 教师、20+ 班级"
              - "参与课程体系调整并落地 curriculum map、教材、测评、分班与复习方案"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [product rollout, system design, curriculum transformation, stakeholder management, operations]
                text:
                  zh: "核心参与学校国际课程体系升级与落地，覆盖英语、数学、化学等多学科；将新课程标准转化为课程地图、教学进度、教材体系、测评机制、分班逻辑与复习方案，连接课程设计、教师执行与教务运营，支撑 200+ 学生、40+ 教师及 20+ 班级稳定运行。"
                  en: "Helped operationalize a multi-subject international curriculum transition across English, Mathematics and Chemistry, translating new standards into curriculum maps, pacing, resources, assessment and placement mechanisms for 200+ students, 40+ teachers and 20+ classes."
              - profile: education_product
                tags: [curriculum design, learning product, assessment, content system]
                text:
                  zh: "推动英语、数学、化学等多学科课程体系落地，建立 curriculum map、教材、阶段测评和课程衔接方案，将课程框架转化为教师可直接执行、可持续迭代的教学体系。"
                  en: "Built executable curriculum systems across English, Mathematics and Chemistry, covering curriculum maps, instructional resources, staged assessment and bridging content so teachers could deliver consistently without rebuilding from scratch."
              - profile: solutions
                tags: [implementation, rollout, stakeholder alignment, delivery]
                text:
                  zh: "协调课程、教师、学生与运营约束，将新的国际课程体系转化为可执行方案，并支持 200+ 学生和 40+ 教师完成课程体系切换与稳定运行。"
                  en: "Coordinated curriculum, teacher, student and operational constraints to turn a new international curriculum framework into an executable rollout supporting 200+ students and 40+ teachers."
          - id: hailiang-assets
            facts:
              - "参与教材体系建设与课程资源选型"
              - "形成课程包、bridging content 和阶段性学习任务"
            default_profile: education_product
            variants:
              - profile: education_product
                tags: [curriculum, content strategy, learning design, instructional design]
                text:
                  zh: "负责多学科课程研发与教学资源体系建设，根据 syllabus、学生基础、授课周期和考试要求筛选并重组教材、练习、Past Papers 与补充材料，沉淀为可复制、可交接、可持续迭代的课程资产。"
                  en: "Developed reusable curriculum assets by selecting and restructuring textbooks, practice, past papers and bridging materials against syllabus requirements, learner readiness, teaching time and assessment needs."
              - profile: ai_product
                tags: [productization, reusable assets, user workflow, systemization]
                text:
                  zh: "将分散的教材、练习、考试资源与教师经验重构为可复用课程资产和标准化执行路径，降低课程交付对个人教师临时备课与隐性经验的依赖。"
                  en: "Productized fragmented resources and tacit teacher knowledge into reusable curriculum assets and repeatable delivery workflows, reducing dependency on individual teachers' ad-hoc preparation."
              - profile: solutions
                tags: [enablement, implementation, documentation, adoption]
                text:
                  zh: "建立教师可直接执行的课程包与衔接材料，支持新课程快速上线、教师接手与后续迭代，把一次性课程设计转化为可持续交付能力。"
                  en: "Created teacher-ready curriculum packages and bridging resources that supported faster rollout, handover and continuous iteration."
          - id: hailiang-lifecycle
            facts:
              - "深度介入学生从入学、分班、选课、阶段调整到大学申请的完整学术生命周期"
              - "协调学生、家长、教师与管理层"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [user lifecycle, decision making, stakeholder management, prioritization, user research]
                text:
                  zh: "深度介入学生从入学、分班、选课、阶段调整到大学申请的完整学术生命周期，综合诊断测评、学业表现、课程难度、升学目标与个体情况，在关键节点支持学校和学生做出高影响决策，并协调学生、家长、教师与管理层形成可执行方案。"
                  en: "Supported students across the full academic lifecycle—from entry and placement through subject selection, progression changes and university applications—synthesizing performance, course difficulty and long-term goals into high-impact recommendations across students, parents, teachers and school leadership."
              - profile: solutions
                tags: [stakeholder, advisory, customer journey, decision support, implementation]
                text:
                  zh: "长期持有学生完整学术 context，在分班、选课、课程调整和升学关键节点整合多源信息并协调多方诉求，帮助学校将复杂个案转化为可执行的学术与升学方案。"
                  en: "Maintained longitudinal student context and coordinated multiple stakeholders to turn complex placement, subject-selection and progression cases into executable academic plans."
              - profile: education_product
                tags: [student success, learner journey, academic advising, personalization]
                text:
                  zh: "基于诊断测评、持续学业表现与升学目标参与学生全周期规划，使分班、选课和阶段调整不再只是一次性判断，而是能够随学生发展持续修正的学习路径。"
                  en: "Used diagnostic evidence, ongoing performance and progression goals to treat placement and course decisions as an evolving learner pathway rather than one-off decisions."
          - id: hailiang-chem-system
            facts:
              - "从零建立 A-Level Chemistry 教学与备考体系"
              - "覆盖课程规划、知识与记忆材料、分层练习、Past Paper、Mock、实验训练、常见失分与考前复习"
