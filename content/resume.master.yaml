                text:
                  zh: "从零建立并迭代完整的 A-Level Chemistry 教学与备考体系，并进一步将课程规划、知识与记忆材料、分层练习、Past Paper、实验训练与高频错误等逻辑产品化为 9701 Learning Product Suite，已有 20+ 学生在真实课堂及课后使用。"
                  en: "Built an end-to-end A-Level Chemistry teaching and exam-preparation system from scratch, then productized its curriculum, retrieval, practice and error-analysis logic into the 9701 Learning Product Suite used by 20+ students in real classroom and self-study settings."
              - profile: education_product
                tags: [curriculum system, assessment, retrieval practice, exam preparation]
                text:
                  zh: "建立覆盖 syllabus mapping、年度课程规划、核心知识、分层练习、Past Paper、Mock、实验训练、常见失分与考前 revision 的完整 A-Level Chemistry 体系，并根据学生表现持续迭代。"
                  en: "Created a reusable A-Level Chemistry system spanning syllabus mapping, annual pacing, core knowledge, differentiated practice, past papers, mocks, practical training and revision."
          - id: hailiang-enablement
            facts:
              - "负责 Chemistry practical 准备、Mock practical 与实验考试培训"
              - "培养并交接新任 A-Level Chemistry 教师"
            default_profile: solutions
            variants:
              - profile: solutions
                tags: [enablement, onboarding, knowledge transfer, operations, delivery]
                text:
                  zh: "建立 Chemistry practical 的准备、训练与考试交付流程，并承担新任 A-Level Chemistry 教师培养与课程能力交接，将 curriculum map、assessment standards、Past Paper、实验准备与常见学生问题从个人经验转化为可复制的团队能力。"
                  en: "Standardized Chemistry practical preparation and exam delivery while onboarding a new A-Level Chemistry teacher, transferring curriculum maps, assessment standards, past-paper practice and practical workflows into reusable team capability."
              - profile: education_product
                tags: [teacher enablement, teacher workflow, assessment, curriculum operations]
