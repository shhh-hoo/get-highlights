                  en: "Owned 9701 end to end—from problem framing and information architecture through learning interaction, engineering, deployment and iteration—with 20+ students using it in real classroom and self-study contexts."
              - profile: education_product
                tags: [learning product, curriculum, student experience, adoption]
                text:
                  zh: "将真实课堂中的 syllabus structure、考试要求、高频错误与学生复习行为转化为统一数字学习体验，并通过 20+ 学生实际使用持续修正课程结构和交互机制。"
                  en: "Translated syllabus structure, exam expectations, recurring errors and revision behavior into a unified digital learning experience iterated through real usage by 20+ students."
          - id: p9701-tradeoff
            facts:
              - "曾将早期 3D reaction network 改为更清晰的 2D 信息结构"
              - "原因包括移动端使用、认知负担与真实复习效率"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [product decision, user behavior, tradeoff, usability, iteration]
                text:
                  zh: "基于移动端使用方式、认知负担与复习效率主动推翻早期 3D reaction network 设计，改为更清晰、可检索的 2D 信息结构；把“视觉复杂度”让位于真实学习任务中的可用性。"
                  en: "Reversed an early 3D reaction-network direction after evaluating mobile behavior, cognitive load and revision efficiency, moving to a clearer searchable 2D structure—prioritizing real learning utility over visual sophistication."
              - profile: education_product
                tags: [cognitive load, learning design, mobile, usability]
                text:
                  zh: "根据学生真实复习场景将早期 3D reaction network 改为更清晰的 2D 结构，降低移动端操作与认知成本，使信息更适合检索、回忆和考试复习。"
                  en: "Shifted from a 3D reaction network to a clearer 2D structure to reduce mobile interaction and cognitive cost for retrieval and exam revision."
          - id: p9701-ai-boundary
            facts:
              - "确定性答案、知识回忆优先 deterministic interaction"
              - "开放表达再评估 AI 是否有真实增益"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [ai boundary, deterministic, llm, product judgment, reliability]
                text:
                  zh: "按任务不确定性划分 AI 边界：标准答案、知识回忆和可枚举反馈优先 deterministic interaction；只有开放表达理解与重构等环节才引入生成式 AI，避免为 AI 而 AI。"
                  en: "Set AI boundaries by task uncertainty: deterministic interactions handle known answers, retrieval and enumerable feedback, while generative AI is reserved for interpreting and reconstructing open-ended responses."
      - id: raku
        title: { zh: "Teach Raku a Game", en: "Teach Raku a Game" }
        subtitle: { zh: "AI Collaborative Learning Prototype｜Product Design + Agent Interaction + Eval", en: "AI Collaborative Learning Prototype · Product Design + Agent Interaction + Eval" }
        meta: { zh: "2026.08｜Prototype + Eval", en: "Aug 2026 · Prototype + Eval" }
        bullets:
          - id: raku-problem
            facts:
              - "8–10 分钟 AI 协作学习闭环"
              - "抽象 9 类学生沟通失败模式"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [agent product, user behavior, learning objective, interaction design]
                text:
                  zh: "设计 8–10 分钟 Agent-mediated learning loop，让学生通过教 AI 玩多步骤游戏建立 shared process understanding；从真实教学中抽象 9 类沟通失败模式，并转化为产品状态与 AI response strategy。"
                  en: "Designed an 8–10 minute agent-mediated learning loop in which students teach an AI a multi-step game; translated nine recurring communication failure modes into product states and response strategies."
              - profile: education_product
                tags: [learning objective, communication, scaffolding, student behavior]
                text:
                  zh: "围绕“根据听众状态提供足够信息并通过行为验证理解”这一学习目标，将碎片化表达、默认共享背景、顺序缺失、条件遗漏等 9 类学生困难转化为可观察、可练习的学习行为。"
                  en: "Turned nine common communication difficulties into observable practice around adapting explanations to a listener and verifying shared understanding through behavior."
          - id: raku-boundary
            facts:
              - "可枚举流程、游戏状态与完成条件使用 deterministic logic"
              - "开放语言理解与下一步教学回应交给 LLM"
              - "设计 Leakage Guard 防止 AI 过早补全答案"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [llm, guardrail, deterministic, agent, ai safety, state machine]
                text:
                  zh: "明确 deterministic 与 generative AI 的职责边界：状态和完成条件使用规则系统，开放语言理解与下一步教学回应交给 LLM；通过 Leakage Guard 防止 Agent 因模型能力过强而替学生完成关键认知工作。"
                  en: "Separated deterministic game state and completion logic from LLM-based language interpretation and teaching responses, with a Leakage Guard preventing the agent from completing the learner's cognitive work for them."
              - profile: technical
                tags: [state machine, structured output, guardrail, llm orchestration]
                text:
                  zh: "将可枚举状态固化为 state transition，把开放理解限制在 structured LLM output，并通过 Leakage Guard 约束模型越权行为，使 Agent 行为可测、可回放、可修订。"
                  en: "Encoded enumerable behavior in state transitions, constrained open interpretation to structured LLM output and guarded against model overreach so agent behavior remained testable and revisable."
          - id: raku-eval
            facts:
              - "使用 Dify workflow、structured output、conversation trace、live run 与 Eval cases"
              - "覆盖正确、部分正确、表达混乱、跑题及异常路径"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [eval, bad cases, structured output, testing, iteration]
                text:
                  zh: "使用 structured output、conversation trace、live runs 与 Eval cases 覆盖正确、部分正确、表达混乱、跑题及异常路径，并根据 bad cases 迭代 Prompt、状态机与完成条件。"
                  en: "Used structured outputs, conversation traces, live runs and eval cases across correct, partial, confused, off-task and abnormal paths, iterating prompts, state transitions and completion criteria from bad cases."
      - id: foundry
        title: { zh: "Learning Foundry", en: "Learning Foundry" }
        subtitle: { zh: "Expert-governed AI Learning Infrastructure｜Product Architecture", en: "Expert-governed AI Learning Infrastructure · Product Architecture" }
        meta: { zh: "Work in Progress", en: "Work in Progress" }
        bullets:
          - id: foundry-lifecycle
            facts:
              - "定义 authoring、evaluation、expert review、registry、runtime delivery、learner trace、revision、rollback 生命周期"
              - "将课程知识与 component behaviour 分离"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [platform, product architecture, governance, lifecycle, infrastructure]
                text:
                  zh: "定义 expert-governed learning component 生命周期，将课程知识与 component behaviour 分离，并贯通 authoring、evaluation、expert review、registry、runtime、learner trace、revision 与 rollback，探索可测试、可版本化的 AI Learning 基础设施。"
                  en: "Defined an expert-governed learning-component lifecycle that separates curriculum knowledge from component behavior across authoring, evaluation, review, registry, runtime, learner trace, revision and rollback."
              - profile: technical
                tags: [schema, protocol, versioning, runtime, architecture]
                text:
                  zh: "设计 component protocol、schema、状态、证据与版本边界，使外部课程知识可以通过统一协议接入，同时保持 runtime 行为可测试、可回滚。"
                  en: "Designed component protocols, schemas, state and evidence boundaries so external curriculum knowledge can plug into a testable, versioned and rollback-capable runtime."
          - id: foundry-ai-boundary
            facts:
              - "核心研究 AI / deterministic / human review 的职责边界"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [human in the loop, ai governance, deterministic, evaluation, product strategy]
                text:
                  zh: "把重点放在 AI、deterministic checking 与 human review 的责任边界：生成式能力只有在不确定判断上介入，正式发布仍要求可验证证据和专家治理，而非单纯扩大模型生成能力。"
                  en: "Focused the product architecture on responsibility boundaries between generative AI, deterministic checking and human review, requiring verifiable evidence and expert governance before release."

about:
  title: { zh: "个人概述", en: "PROFILE" }
  paragraphs:
    - zh: "具备约六年软件工程、国际教育、课程研发与数字产品实践。早期参与分布式流数据库 HStreamDB 的生产研发与版本交付，后长期工作于国际学校一线，深度介入课程体系建设、学生全生命周期决策、考试运营与教师培养，并独立设计、开发和上线面向真实学生使用的学习产品。"
      en: "Six years across software engineering, international education, curriculum development and digital product work. Began in production distributed-systems engineering, then moved into frontline education where I owned curriculum systems, student lifecycle decisions, assessment operations and teacher enablement while building learning products used by real students."
    - zh: "当前聚焦 AI Learning Product，擅长从真实用户问题出发完成问题定义、产品机制设计、技术边界判断、快速原型、Eval 与迭代；尤其关注生成式 AI、确定性系统与人工判断各自应该承担什么，而不是把 AI 简化为内容生成或聊天机器人。"
      en: "Now focused on AI Learning Product: problem framing, interaction and system design, technical trade-offs, rapid prototyping, evaluation and iteration—with particular attention to where generative AI, deterministic systems and human judgment should each be responsible."

