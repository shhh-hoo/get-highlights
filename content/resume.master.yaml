                  zh: "将课程节奏、测评标准、Past Paper 使用、实验准备与学生高频问题沉淀成可交接流程，通过共同备课、课堂沟通与考试复盘帮助新教师逐步独立承担完整课程周期。"
                  en: "Turned pacing, assessment, past-paper use, practical preparation and recurring learner issues into a teachable operating system that enabled a new teacher to independently own the full course cycle."
          - id: hailiang-outcomes
            facts:
              - "三年来学校各年级化学 A/A* 率在全集团保持领先"
              - "2025 年获校级最佳教师奖"
            default_profile: ai_product
            variants:
              - profile: ai_product
                tags: [outcomes, metrics, iteration, quality, results]
                text:
                  zh: "持续用学生表现、Mock 与正式考试结果反向迭代课程设计与教学策略；三年来学校各年级 Chemistry A/A* 率在全集团保持领先，并获 2025 年校级“最佳教师奖”。"
                  en: "Closed the loop between learner performance, mock exams and curriculum iteration; Chemistry A/A* rates remained among the group's leaders across grade levels for three years, alongside a 2025 school-level Best Teacher Award."
              - profile: education_product
                tags: [learning outcomes, assessment, continuous improvement]
                text:
                  zh: "以 Mock、正式考试和高频失分数据持续修正课程顺序、练习强度与答题训练，三年来学校各年级 Chemistry A/A* 率在全集团保持领先。"
                  en: "Used mock and final assessment evidence to continuously revise sequencing, practice intensity and exam strategy, sustaining group-leading Chemistry A/A* rates across grade levels for three years."
